
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JobStart - Criar conta</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="header">

        <div class="container nav">

            <a href="index.html" class="logo">
                JobStart
            </a>

            <nav>

                <a href="index.html">
                    Início
                </a>

                <a href="vagas.html">
                    Vagas
                </a>

                <a href="login.html">
                    Entrar
                </a>

            </nav>

        </div>

    </header>


    <main>

        <section class="auth-section">

            <div class="auth-card">

                <h1>
                    Criar conta
                </h1>

                <p class="auth-subtitle">
                    Crie sua conta gratuitamente no JobStart.
                </p>


                <form id="cadastroForm">

                    <div class="form-group">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="tipo">
                            Tipo de conta
                        </label>

                        <select
                            id="tipo"
                            required
                        >

                            <option value="">
                                Selecione uma opção
                            </option>

                            <option value="candidato">
                                Candidato
                            </option>

                            <option value="empresa">
                                Empresa
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn-primary auth-button"
                    >
                        Criar conta
                    </button>


                    <p
                        id="cadastroMessage"
                        class="auth-message"
                    ></p>

                </form>


                <p class="auth-footer">

                    Já possui uma conta?

                    <a href="login.html">
                        Entrar
                    </a>

                </p>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                © 2026 JobStart. Todos os direitos reservados.
            </p>

        </div>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
