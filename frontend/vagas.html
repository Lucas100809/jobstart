<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JobStart - Vagas</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="header">

        <div class="container nav">

            <a href="index.html" class="logo">
                JobStart
            </a>

            <nav>

                <a href="index.html">
                    Início
                </a>

                <a href="vagas.html">
                    Vagas
                </a>

                <a href="login.html">
                    Entrar
                </a>

                <a href="cadastro.html">
                    Criar conta
                </a>

            </nav>

        </div>

    </header>


    <main>

        <section class="jobs-header">

            <div class="container">

                <h1>
                    Encontre sua oportunidade
                </h1>

                <p>
                    Encontre vagas de Jovem Aprendiz
                    para começar sua carreira.
                </p>

            </div>

        </section>


        <section class="jobs-section">

            <div class="container">

                <!-- FILTROS -->

                <div class="filters">

                    <div class="filter-group">

                        <label for="searchInput">
                            Pesquisar vaga
                        </label>

                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Ex: Desenvolvimento, Suporte..."
                        >

                    </div>


                    <div class="filter-group">

                        <label for="areaFilter">
                            Área
                        </label>

                        <select id="areaFilter">

                            <option value="">
                                Todas as áreas
                            </option>

                            <option value="Tecnologia">
                                Tecnologia
                            </option>

                            <option value="Administrativo">
                                Administrativo
                            </option>

                            <option value="Marketing">
                                Marketing
                            </option>

                            <option value="Logística">
                                Logística
                            </option>

                            <option value="Produção">
                                Produção
                            </option>

                        </select>

                    </div>


                    <div class="filter-group">

                        <label for="cityFilter">
                            Cidade
                        </label>

                        <input
                            type="text"
                            id="cityFilter"
                            placeholder="Ex: Guarulhos"
                        >

                    </div>


                    <div class="filter-group">

                        <label for="modelFilter">
                            Modelo
                        </label>

                        <select id="modelFilter">

                            <option value="">
                                Todos
                            </option>

                            <option value="Presencial">
                                Presencial
                            </option>

                            <option value="Híbrido">
                                Híbrido
                            </option>

                            <option value="Remoto">
                                Remoto
                            </option>

                        </select>

                    </div>


                    <button
                        type="button"
                        id="clearFilters"
                        class="filter-button"
                    >
                        Limpar filtros
                    </button>

                </div>


                <!-- RESULTADO -->

                <div class="jobs-result-header">

                    <h2>
                        Vagas disponíveis
                    </h2>

                    <span id="jobsCount">
                        Carregando...
                    </span>

                </div>


                <div
                    id="jobsContainer"
                    class="jobs-grid"
                >

                    <p>
                        Carregando vagas...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                © 2026 JobStart.
                Todos os direitos reservados.
            </p>

        </div>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
