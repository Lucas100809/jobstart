<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Vaga - JobStart</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            JobStart
        </div>

        <nav>
            <a href="empresa.html">Voltar ao painel</a>
        </nav>
    </header>

    <main class="form-page">

        <div class="form-container">

            <h1>Nova vaga</h1>

            <p class="form-description">
                Cadastre uma nova oportunidade para jovens aprendizes.
            </p>

            <form id="jobForm">

                <div class="form-group">
                    <label for="titulo">Título da vaga</label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="Ex: Jovem Aprendiz - Suporte de TI"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>

                    <textarea
                        id="descricao"
                        rows="5"
                        placeholder="Descreva as atividades da vaga..."
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="area">Área</label>

                    <select id="area" required>
                        <option value="">Selecione uma área</option>
                        <option value="Tecnologia">Tecnologia</option>
                        <option value="Administrativo">Administrativo</option>
                        <option value="Logística">Logística</option>
                        <option value="Produção">Produção</option>
                        <option value="Atendimento">Atendimento</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Recursos Humanos">Recursos Humanos</option>
                        <option value="Financeiro">Financeiro</option>
                    </select>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="cidade">Cidade</label>

                        <input
                            type="text"
                            id="cidade"
                            placeholder="Ex: Guarulhos"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado</label>

                        <select id="estado" required>
                            <option value="">Selecione</option>
                            <option value="SP">SP</option>
                            <option value="RJ">RJ</option>
                            <option value="MG">MG</option>
                            <option value="PR">PR</option>
                            <option value="SC">SC</option>
                            <option value="RS">RS</option>
                            <option value="BA">BA</option>
                            <option value="PE">PE</option>
                            <option value="CE">CE</option>
                            <option value="GO">GO</option>
                            <option value="ES">ES</option>
                            <option value="DF">DF</option>
                        </select>
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="salario">Salário</label>

                        <input
                            type="number"
                            id="salario"
                            placeholder="Ex: 950"
                            min="0"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="modelo">Modelo de trabalho</label>

                        <select id="modelo" required>
                            <option value="">Selecione</option>
                            <option value="Presencial">Presencial</option>
                            <option value="Híbrido">Híbrido</option>
                            <option value="Remoto">Remoto</option>
                        </select>
                    </div>

                </div>

                <div id="jobMessage"></div>

                <button type="submit" class="primary-button">
                    Publicar vaga
                </button>

            </form>

        </div>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
